name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            target: amdl_windows_amd64.exe
          - goos: windows
            goarch: arm64
            target: amdl_windows_arm64.exe
          - goos: linux
            goarch: amd64
            target: amdl_linux_amd64
          - goos: linux
            goarch: arm64
            target: amdl_linux_arm64
          - goos: android
            goarch: arm64
            target: amdl_android_arm64
            # Android needs cgo so DNS goes through bionic's resolver; the pure-Go
            # resolver reads /etc/resolv.conf, which Android does not have.
            cgo: 1
            cc: aarch64-linux-android24-clang
          - goos: darwin
            goarch: amd64
            target: amdl_darwin_amd64
          - goos: darwin
            goarch: arm64
            target: amdl_darwin_arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || 0 }}
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          fi
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OUTPUT_NAME="${{ matrix.target }}"
          go build -trimpath -ldflags="-s -w \
            -X 'amdl/internal/version.Version=${{ github.ref_name }}' \
            -X 'amdl/internal/version.Commit=${{ github.sha }}' \
            -X 'amdl/internal/version.BuildDate=${BUILD_DATE}'" \
            -o "${OUTPUT_NAME}" .
          echo "BUILT_FILE=${OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILT_FILE }}
          path: ${{ env.BUILT_FILE }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum amdl_* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
